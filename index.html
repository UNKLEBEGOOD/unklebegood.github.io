<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odoh Ekenedirichukwu J. | Data Analyst Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 60px 20px 40px;
    border-bottom: 1px solid #21262d;
  }
  header h1 { font-size: 2rem; margin-bottom: 8px; }
  header p.tagline { color: #8b949e; font-size: 1.1rem; margin-bottom: 20px; }
  .links a {
    color: #58a6ff;
    text-decoration: none;
    margin: 0 10px;
    font-size: 0.95rem;
  }
  .links a:hover { text-decoration: underline; }
  main { max-width: 800px; margin: 0 auto; padding: 50px 20px; }
  section { margin-bottom: 50px; }
  h2 {
    font-size: 1.4rem;
    border-left: 4px solid #58a6ff;
    padding-left: 12px;
    margin-bottom: 20px;
  }
  .about p { color: #c9d1d9; }
  .skills-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
  }
  .skills-list span {
    background: #161b22;
    border: 1px solid #30363d;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.9rem;
  }
  .project-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 24px;
    transition: border-color 0.2s;
    margin-bottom: 20px;
  }
  .project-card:hover { border-color: #58a6ff; }
  .project-card h3 { margin-bottom: 10px; font-size: 1.2rem; }
  .project-card p { color: #8b949e; margin-bottom: 14px; }
  .project-card a {
    color: #58a6ff;
    text-decoration: none;
    font-weight: 600;
  }
